spring:
  application:
    name: ms-account
  config:
    import:
      - optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
      - optional:classpath:mongo-credentials.yaml
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

server:
  port: ${SERVER_PORT:8081}

jwt:
  issuer: ms-customer
  public-key-location: ${JWT_PUBLIC_KEY_LOCATION:file:secrets/jwt-public-key.pem}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info

resilience4j:
  circuitbreaker:
    instances:
      customer:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s

account:
  rules:
    minimum-opening-amount: 0.00
    vip-minimum-monthly-average: 2000.00
    fixed-term-allowed-day-of-month: 15
  clients:
    customer-base-url: ${CUSTOMER_BASE_URL:http://localhost:8080}
    timeout: 2s
  catalog:
    cache-ttl: 10m
